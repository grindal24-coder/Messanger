<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HLZ Chat</title>
<style>
:root{--bg:#0f1115;--p:#171a21;--p2:#1f232c;--t:#fff;--g:#8b93a1;--a:#3b82f6;--b:#2a2f3a}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--t);font:15px system-ui,sans-serif}
button,input{font:inherit;color:inherit}
input{background:var(--p2);border:1px solid var(--b);border-radius:10px;padding:10px 12px;outline:0;width:100%}
input:focus{border-color:var(--a)}
button{background:var(--a);border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
button.i{background:var(--p2);padding:9px 12px}
.hide{display:none!important}
#auth{display:flex;height:100%;align-items:center;justify-content:center;padding:16px}
.card{background:var(--p);border-radius:16px;padding:24px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
.err{color:#f87171;font-size:13px;min-height:16px}
.lnk{background:none;color:var(--g);padding:4px}
#app{display:flex;height:100%}
#side{width:25%;min-width:300px;background:var(--p);display:flex;flex-direction:column;border-right:1px solid var(--b)}
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg) radial-gradient(circle at 30% 20%,#1b2540,transparent 60%),radial-gradient(circle at 80% 90%,#2a1b3d,transparent 55%)}
.top{display:flex;gap:8px;padding:10px;padding-top:max(10px,env(safe-area-inset-top))}
#list{flex:1;overflow:auto}
.row{display:flex;gap:10px;align-items:center;padding:10px 14px;cursor:pointer}
.row:hover{background:var(--p2)}
.row .n{font-weight:600}.row .s{color:var(--g);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row div{min-width:0}
.av{width:44px;height:44px;border-radius:50%;background:var(--a);display:flex;align-items:center;justify-content:center;font-weight:700;object-fit:cover;flex:none}
.empty{color:var(--g);text-align:center;padding:40px 16px}
#ph{margin:auto;color:var(--g);background:#0006;padding:8px 16px;border-radius:20px}
#chat{display:flex;flex-direction:column;height:100%}
.head{display:flex;gap:8px;align-items:center;padding:10px;padding-top:max(10px,env(safe-area-inset-top))}
.pill{flex:1;display:flex;gap:10px;align-items:center;background:var(--p);border-radius:16px;padding:6px 12px;cursor:pointer;min-width:0}
#msgs{flex:1;overflow:auto;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.m{max-width:75%;padding:8px 12px;border-radius:14px;background:var(--p2);align-self:flex-start;white-space:pre-wrap;word-break:break-word}
.m.me{background:var(--a);align-self:flex-end}
.m small{display:block;font-size:11px;opacity:.6;text-align:right}
.send{display:flex;gap:8px;padding:10px;padding-bottom:max(10px,env(safe-area-inset-bottom));position:relative}
#emo{position:absolute;bottom:62px;left:10px;background:var(--p);border:1px solid var(--b);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:4px;max-width:260px}
#emo span{font-size:22px;cursor:pointer;padding:2px}
.w{flex:1;position:relative;min-width:0}.w input{padding-right:44px}.pl{position:absolute;right:2px;top:2px;font-size:26px;color:var(--g);padding:4px 10px}
#sheet{position:fixed;inset:0;background:#0008;z-index:10;display:flex;align-items:flex-end}
.sh{background:var(--p);width:100%;max-width:520px;margin:0 auto;height:50%;border-radius:20px 20px 0 0;padding:20px;display:flex;flex-direction:column;gap:14px;padding-bottom:max(20px,env(safe-area-inset-bottom))}
.tiles{display:flex;gap:12px}.tiles button{flex:1;font-size:18px;padding:24px 8px;line-height:1.8}
.m img{max-width:100%;max-height:320px;border-radius:10px;display:block;cursor:pointer;min-width:80px;min-height:60px}.m audio{width:230px;height:40px;display:block}
#cm{position:fixed;z-index:20;background:var(--p);border:1px solid var(--b);border-radius:12px;padding:6px;min-width:200px;box-shadow:0 8px 24px #0008}
#cm div{display:flex;gap:14px;padding:10px 12px;border-radius:8px;cursor:pointer}#cm div:hover{background:var(--p2)}.red{color:#f87171}
.q{border-left:3px solid #fff8;padding-left:8px;margin-bottom:4px;font-size:13px;opacity:.8}
#rb{display:flex;gap:8px;padding:6px 14px;background:var(--p);color:var(--g);align-items:center;justify-content:space-between}#rt{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.aw{position:relative;display:inline-flex;flex:none}.dot{position:absolute;right:0;bottom:0;width:14px;height:14px;border-radius:50%;background:#3b82f6;border:2px solid var(--p);transform:translate(22%,22%)}.c .dot{width:20px;height:20px;border-width:3px}
#pv{display:flex;gap:8px;overflow-x:auto;padding:8px 14px;background:var(--p)}#pv div{position:relative;flex:none}#pv img{height:90px;border-radius:10px;display:block}#pv button{position:absolute;top:3px;right:3px;padding:0 7px;border-radius:50%;background:#000a}
.ims{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}.ims img{max-width:100%;max-height:260px}
#mic{touch-action:none;user-select:none;-webkit-user-select:none}#lk{position:absolute;right:10px;bottom:70px;cursor:pointer;z-index:4;background:var(--p2);border:1px solid var(--b);border-radius:22px;padding:12px 13px;font-size:20px}
#mic{position:relative;width:46px;min-height:40px;padding:0;overflow:hidden;transition:background .3s}#mic span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .35s,transform .35s}
#mi2{opacity:0;transform:rotate(90deg) scale(.3)}#mic.v #mi1{opacity:0;transform:rotate(-90deg) scale(.3)}#mic.v #mi2{opacity:1;transform:none}
#mic b{font-size:12px;white-space:nowrap}#mic.r{width:auto;min-width:64px;padding:0 10px;background:#dc2626}#mic.r span{display:none}#mic.s{background:var(--a)}
.fb{position:absolute;right:10px;bottom:70px;width:48px;height:48px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;font-size:20px;border:1px solid var(--b)}
#fl{right:auto;left:calc(50% + 62px);bottom:82px;width:44px;height:44px;z-index:4}#pb{bottom:128px}
#cpv{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);width:200px;height:200px;border-radius:50%;object-fit:cover;border:3px solid var(--a);background:#000;z-index:3}
.ims video{max-width:100%;max-height:300px;border-radius:10px}.ims video.vc{width:220px;height:220px;max-height:none;border-radius:50%;object-fit:cover;cursor:pointer}
#pv video{height:90px;border-radius:10px;display:block}.pg{display:flex;align-items:center;justify-content:center;height:90px;min-width:90px;background:var(--p2);border-radius:10px;padding:0 10px}
#call{position:fixed;inset:0;z-index:30;background:linear-gradient(#10131a,#1b2540);display:flex;align-items:center;justify-content:center}
.cc{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px}#cav .av{width:120px;height:120px;font-size:44px}#cn{font-size:22px}#cs{color:var(--g)}
.cb{display:flex;gap:18px;margin-top:40px}.cb button{width:64px;height:64px;border-radius:50%;font-size:26px;padding:0}.cg{background:#16a34a!important}.cr{background:#dc2626!important;transform:rotate(135deg)}.cb .on{background:#fff;color:#000}
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .6s}
#splash.out{opacity:0;pointer-events:none}#splash b{font-size:46px;letter-spacing:6px}.sp{width:30px;height:30px;border:3px solid var(--b);border-top-color:var(--a);border-radius:50%;animation:rot 1s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
#ed{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:20px;background:#0006}
#em video{width:220px;height:220px;border-radius:50%;object-fit:cover}
#tr{position:relative;height:44px;width:min(560px,86%);background:var(--p2);border-radius:10px;margin-top:8px}#sel{position:absolute;top:0;bottom:0;background:#3b82f655}
.hd{position:absolute;top:-6px;width:18px;height:56px;margin-left:-9px;background:var(--a);border-radius:6px;touch-action:none;cursor:ew-resize}
#phd{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff;pointer-events:none}.er{display:flex;gap:14px;align-items:center}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;overflow:auto}
.t{aspect-ratio:1;background:var(--p2);border-radius:10px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px;cursor:pointer}
.t small{font-size:12px;color:var(--g)}.t video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.ci{position:absolute;top:6px;right:6px;font-size:20px;text-shadow:0 0 4px #000}
.m svg{vertical-align:-3px}
.mod{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.mod .card{align-items:stretch;max-height:92%;overflow:auto}
.c{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.c .av{width:96px;height:96px;font-size:36px}
@media(max-width:800px){#side{width:100%;min-width:0}#main{position:fixed;inset:0;z-index:5}body:not(.open) #main{display:none}body.open #side{display:none}.mod{align-items:flex-end}}
</style></head><body>

<div id="splash"><b>HLZ</b><i class="sp"></i></div>
<div id="auth" class="hide"><div class="card">
<h2 id="at">Вход</h2>
<input id="lg" placeholder="Логин (a-z, 0-9, _)" autocapitalize="none" autocomplete="username">
<input id="pw" type="password" placeholder="Пароль" autocomplete="current-password">
<div class="err" id="ae"></div>
<button id="ab">Войти</button>
<button class="lnk" id="as">Нет аккаунта? Регистрация</button>
</div></div>

<div id="app" class="hide">
<div id="side">
 <div class="top"><input id="q" placeholder="Поиск"><button class="i" id="cfg" title="Настройки">⚙</button></div>
 <div id="list"></div>
</div>
<div id="main"><div id="ph">Выберите чат</div><div id="chat" class="hide">
 <div class="head"><button class="i" id="back" title="Закрыть чат">←</button><div class="pill" id="pill"></div><button class="i" id="cl" title="Позвонить">📞</button></div>
 <div id="msgs"></div>
 <div id="ed" class="hide"><div id="em"></div><div id="tr"><div id="sel"></div><div class="hd" id="hl"></div><div class="hd" id="hr"></div><div id="phd"></div></div><div class="er"><button class="i" id="ep">▶</button><span id="et"></span><button class="i" id="edel">🗑</button></div></div>
 <div id="pv" class="hide"></div>
 <div id="rb" class="hide"><span id="rt"></span><button class="lnk" id="rx">✕</button></div>
 <div class="send"><div id="emo" class="hide"></div><div id="lk" class="hide">🔒</div><button class="i fb hide" id="pb">⏸</button><button class="i fb hide" id="rs"></button><button class="i fb hide" id="fl">🔄</button><video id="cpv" class="hide" muted playsinline autoplay></video><button class="i" id="eb">😊</button><div class="w"><input id="mi" placeholder="Сообщение" autocomplete="off"><button class="lnk pl" id="pl">+</button></div><button id="sb">➤</button><button class="i" id="mic"><span id="mi1">🎤</span><span id="mi2"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M10 8.5v7l6-3.5z" fill="currentColor"/></svg></span><b id="tt"></b></button></div>
</div></div>
</div>
<div id="modal" class="mod hide"></div><div id="cm" class="hide"></div><div id="call" class="hide"><div class="cc"><div id="cav"></div><b id="cn"></b><span id="cs"></span><div class="cb" id="cb"></div></div></div><audio id="ra" autoplay></audio>
<div id="sheet" class="hide"><div class="sh"><div class="gr"><div class="t" id="tcam"><video id="cam" muted playsinline autoplay></video><span class="ci">📷</span></div><div class="t" id="tgal">🖼<small>Галерея</small></div></div></div></div>
<input type="file" id="fg" accept="image/*,video/*" multiple hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// === НАСТРОЙКИ: вставь свои значения из Supabase (Project Settings -> API) ===
const URL_='https://rhznlpfnzyoawcmbuppz.supabase.co', KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJoem5scGZuenlvYXdjbWJ1cHB6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5MzQ3NjQsImV4cCI6MjEwODUxMDc2NH0.jlIBlA-t1dM53I8EBY9FOiLxUFw9H1s7CUI-gP884nk';
const DOM='@hlzchat.org';
const sb=supabase.createClient(URL_,KEY);
const $=i=>document.getElementById(i);
let me,cur=null,chats={},msgs={},reg=false,ch;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- сжатие на устройстве (до отправки) ----------
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode(...u.subarray(i,i+8192));return btoa(s)};
const unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function pipe(u,S){const r=new Response(new Blob([u]).stream().pipeThrough(new S('deflate-raw')));return new Uint8Array(await r.arrayBuffer())}
async function pack(t){const u=new TextEncoder().encode(t);try{const z=await pipe(u,CompressionStream);if(z.length<u.length)return'd:'+b64(z)}catch(e){}return'r:'+b64(u)}
async function unpack(s){if(s[0]=='m')return s;const u=unb(s.slice(2));return new TextDecoder().decode(s[0]=='d'?await pipe(u,DecompressionStream):u)}
function avImg(f,px){return new Promise((ok,no)=>{const i=new Image,r=new FileReader;r.onload=()=>{i.src=r.result};i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=px;const x=c.getContext('2d'),m=Math.min(i.width,i.height);x.drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,px,px);ok(c.toDataURL('image/webp',.8))};i.onerror=no;r.readAsDataURL(f)})}

// ---------- вход / регистрация ----------
$('as').onclick=()=>{reg=!reg;$('at').textContent=reg?'Регистрация':'Вход';$('ab').textContent=reg?'Создать аккаунт':'Войти';$('as').textContent=reg?'Уже есть аккаунт? Войти':'Нет аккаунта? Регистрация';$('ae').textContent=''};
$('ab').onclick=async()=>{
 const l=$('lg').value.trim().toLowerCase(),p=$('pw').value,e=$('ae');e.textContent='';
 if(!/^[a-z0-9_]{3,20}$/.test(l))return e.textContent='Логин: 3–20 символов a-z, 0-9, _';
 if(p.length<6)return e.textContent='Пароль минимум 6 символов';
 if(reg){
  const r=await sb.auth.signUp({email:l+DOM,password:p});
  if(r.error)return e.textContent=/already/i.test(r.error.message)?'Логин занят':r.error.message;
  if(!r.data.session)return e.textContent='Отключи Confirm email в Supabase (Auth -> Providers -> Email)';
  const q=await sb.from('profiles').insert({id:r.data.user.id,username:l,nick:l});
  if(q.error){await sb.auth.signOut();return e.textContent='Логин занят'}
 }else{
  const r=await sb.auth.signInWithPassword({email:l+DOM,password:p});
  if(r.error)return e.textContent='Неверный логин или пароль';
 }
 start();
};
function splashOut(){$('splash').classList.add('out')}
function noUser(){$('auth').classList.remove('hide');splashOut()}
setTimeout(splashOut,8000);
async function start(){
 const {data:{user}}=await sb.auth.getUser();if(!user){noUser();return}
 const r=await sb.from('profiles').select('*').eq('id',user.id).single();
 if(r.error){noUser();return}me=r.data;
 $('auth').classList.add('hide');$('app').classList.remove('hide');
 await load();clean();presence();callInit();splashOut();
 ch=sb.channel('m').on('postgres_changes',{event:'*',schema:'public',table:'messages'},async p=>{
  const m=p.new;if(!m||!m.id)return;const pid=m.sender==me.id?m.receiver:m.sender;
  if(p.eventType=='UPDATE'){const a=msgs[pid]||[],i=a.findIndex(z=>z.id==m.id);if(i<0)return;
   if(m.deleted_at)a.splice(i,1);else Object.assign(a[i],m,{_t:null});list();if(cur&&cur.id==pid)draw();return}
  if(p.eventType!='INSERT')return;
  if(!chats[pid]){const x=await sb.from('profiles').select('*').eq('id',pid).single();if(x.data)chats[pid]=x.data}
  const a=msgs[pid]=msgs[pid]||[];
  if(!a.some(z=>z.id==m.id)){m._t=null;a.push(m)}
  list();if(cur&&cur.id==pid)draw();
 }).subscribe();
}
async function load(){
 const r=await sb.from('messages').select('*').is('deleted_at',null).or(`sender.eq.${me.id},receiver.eq.${me.id}`).order('created_at',{ascending:true}).limit(2000);
 msgs={};(r.data||[]).forEach(m=>{const p=m.sender==me.id?m.receiver:m.sender;(msgs[p]=msgs[p]||[]).push(m)});
 const ids=Object.keys(msgs);chats={};
 if(ids.length){const x=await sb.from('profiles').select('*').in('id',ids);(x.data||[]).forEach(u=>chats[u.id]=u)}
 list();
}

// ---------- список чатов и поиск ----------
const on=new Set();
const ava=u=>`<span class="aw">${u.avatar?`<img class="av" src="${u.avatar}">`:`<div class="av">${esc((u.nick||'?')[0].toUpperCase())}</div>`}${u.id&&me&&u.id!=me.id&&on.has(u.id)?'<i class="dot"></i>':''}</span>`;
function rows(a,sub){
 $('list').innerHTML=a.length?'':'<div class="empty">Чатов нет</div>';
 a.forEach(u=>{const d=document.createElement('div');d.className='row';d.innerHTML=ava(u)+`<div><div class="n">${esc(u.nick)}</div><div class="s">${sub(u)}</div></div>`;d.onclick=()=>open(u);$('list').append(d)});
}
function list(){
 if($('q').value.trim())return;
 const a=Object.values(chats).filter(u=>msgs[u.id]&&msgs[u.id].length).sort((x,y)=>msgs[y.id].at(-1).created_at.localeCompare(msgs[x.id].at(-1).created_at));
 rows(a,u=>{const m=msgs[u.id].at(-1);return m._t==null?'…':esc(prev(m._t))});
 a.forEach(async u=>{const m=msgs[u.id].at(-1);if(m._t==null){m._t=await unpack(m.body);list()}});
}
let st;$('q').oninput=()=>{clearTimeout(st);st=setTimeout(async()=>{
 const t=$('q').value.trim().replace(/^@/,'').replace(/[%,()]/g,'');if(!t)return list();
 const r=await sb.from('profiles').select('*').or(`username.ilike.%${t}%,nick.ilike.%${t}%`).neq('id',me.id).limit(15);
 rows(r.data||[],u=>'@'+esc(u.username));
},250)};

// ---------- чат ----------
function open(u){
 cur=u;setCtx(null);pend.length=0;showPv();if(!chats[u.id])chats[u.id]=u;
 $('q').value='';list();
 $('ph').classList.add('hide');$('chat').classList.remove('hide');document.body.classList.add('open');
 $('pill').innerHTML=ava(u)+`<b>${esc(u.nick)}</b>`;draw();$('mi').focus();
}
function close(){cur=null;$('chat').classList.add('hide');$('ph').classList.remove('hide');document.body.classList.remove('open')}
$('back').onclick=close;
async function draw(){
 const a=msgs[cur.id]||[],box=$('msgs'),id=cur.id;
 for(const m of a)if(m._t==null)m._t=await unpack(m.body);
 if(!cur||cur.id!=id)return;
 box.innerHTML='';
 a.forEach(m=>{const d=document.createElement('div');d.className='m'+(m.sender==me.id?' me':'');d.oncontextmenu=e=>{e.preventDefault();menu(e.clientX,e.clientY,m)};
  const pm=parse(m._t),hm=pm.i||pm.a||pm.v||pm.c,q=m.reply_to&&a.find(z=>z.id==m.reply_to);d.innerHTML=(q?`<div class="q">${esc(prev(q._t||''))}</div>`:'')+(hm?'<div class="ims"></div>':'')+(pm.t?esc(pm.t):'')+(pm.k?callTxt(m,pm.k):'')+`<small>${m.edited?'изм. · ':''}${new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</small>`;if(hm){const z=d.querySelector('.ims');(pm.i||[]).forEach(x=>media(z,'i',x));(pm.v||[]).forEach(x=>media(z,'v',x));if(pm.a)media(z,'a',pm.a);if(pm.c)media(z,'c',pm.c)}box.append(d)});
 box.scrollTop=box.scrollHeight;
}
async function push(body,t,T,rep){
 const to=T||cur;
 const r=await sb.from('messages').insert({sender:me.id,receiver:to.id,body,reply_to:rep||null}).select().single();
 if(r.error){alert('Не отправлено: '+r.error.message);return false}
 const m=r.data;m._t=t??body;const a=msgs[to.id]=msgs[to.id]||[];
 if(!a.some(z=>z.id==m.id))a.push(m);else a.find(z=>z.id==m.id)._t=m._t;
 draw();list();return true;

 $('ch').onclick=()=>f.click();
 f.onchange=async()=>{if(f.files[0]){av=await avImg(f.files[0],128);$('sa').firstElementChild.outerHTML=ava({avatar:av,nick:me.nick})}};
 $('sv').onclick=async()=>{
  $('se').style.color='#f87171';const u=$('su').value.trim().toLowerCase().replace(/^@/,''),n=$('sn').value.trim();
  if(!/^[a-z0-9_]{3,20}$/.test(u)||!n)return $('se').textContent='Ник не пустой; юзернейм: a-z, 0-9, _ (3–20)';
  const r=await sb.from('profiles').update({nick:n,username:u,avatar:av}).eq('id',me.id);
  if(r.error)return $('se').textContent='Юзернейм занят';
  Object.assign(me,{nick:n,username:u,avatar:av});$('se').style.color='#4ade80';$('se').textContent='Сохранено';
 };
 $('cpw').onclick=async()=>{
  const e=$('se'),bad=t=>{e.style.color='#f87171';e.textContent=t};
  if(!$('op').value)return bad('Введите текущий пароль');
  if($('np').value.length<6)return bad('Новый пароль минимум 6 символов');
  if($('np').value!=$('np2').value)return bad('Новые пароли не совпадают');
  const {data:{user}}=await sb.auth.getUser();
  const c=await sb.auth.signInWithPassword({email:user.email,password:$('op').value});
  if(c.error)return bad('Текущий пароль неверный');
  const r=await sb.auth.updateUser({password:$('np').value});
  if(r.error)return bad(r.error.message);
  e.style.color='#4ade80';e.textContent='Пароль изменён';$('op').value=$('np').value=$('np2').value='';
 };
 $('lo').onclick=()=>{const m=mod('<h3>Выйти из аккаунта?</h3><button id="y" style="background:#dc2626">Выйти</button><button id="n" style="background:#3a3f4b">Отмена</button>');
  $('y').onclick=async()=>{await sb.auth.signOut();location.reload()};$('n').onclick=()=>m.classList.add('hide')};
};
// ---------- голосовые звонки: WebRTC напрямую между телефонами, сигналы через Supabase Realtime ----------
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}
 // для звонков через мобильный интернет добавь TURN: ,{urls:'turn:ХОСТ:443',username:'ЛОГИН',credential:'ПАРОЛЬ'}
]};
let C=null,sig,ring;
const sg=(to,t,d)=>sig.send({type:'broadcast',event:'c',payload:{to:to.id||to,from:me.id,t,d}});
const fmt=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
setInterval(()=>{if(C&&C.live)$('cs').textContent=fmt(Date.now()-C.t0)},1000);
function callInit(){sig=sb.channel('calls').on('broadcast',{event:'c'},m=>onSig(m.payload)).subscribe()}
const mic=()=>navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
function mkPc(){
 const c=C,pc=c.pc=new RTCPeerConnection(ICE);
 c.st.getTracks().forEach(t=>pc.addTrack(t,c.st));
 pc.onicecandidate=e=>e.candidate&&sg(c.u,'ice',e.candidate.toJSON());
 pc.ontrack=e=>{$('ra').srcObject=e.streams[0];$('ra').play().catch(()=>{})};
 pc.oniceconnectionstatechange=()=>{const x=pc.iceConnectionState;
  if(x=='connected'||x=='completed'){if(!c.live){c.live=1;c.t0=Date.now();stopRing()}if(C===c)callUi()}
  else if(x=='failed'&&C===c){callEnd(true);alert('Не удалось соединиться. Для мобильного интернета нужен TURN-сервер')}};
}
async function flushQ(c){for(const x of c.q)try{await c.pc.addIceCandidate(x)}catch(e){}c.q=[]}
async function callStart(u){
 if(C)return;if(!on.has(u.id))return alert(u.nick+' сейчас не в сети');
 let st;try{st=await mic()}catch(e){return alert('Нет доступа к микрофону')}
 const c=C={u,st,q:[],role:'out'};mkPc();
 const o=await c.pc.createOffer();await c.pc.setLocalDescription(o);sg(u,'offer',{sdp:o});
 c.to=setTimeout(()=>{if(C===c&&!c.live){callEnd(true);alert('Нет ответа')}},45000);callUi();
}
async function callAcc(){
 const c=C;if(!c)return;stopRing();let st;try{st=await mic()}catch(e){callEnd(true);return alert('Нет доступа к микрофону')}
 c.st=st;c.acc=1;stopRing();mkPc();await c.pc.setRemoteDescription(c.offer);await flushQ(c);
 const a=await c.pc.createAnswer();await c.pc.setLocalDescription(a);sg(c.u,'answer',{sdp:a});connTo(c);callUi();
}
function callEnd(notify){
 const c=C;if(!c)return;C=null;clearTimeout(c.to);clearTimeout(c.ct);stopRing();if(notify)sg(c.u,'end');if(c.role=='out')logCall(c);
 c.pc&&c.pc.close();c.st&&c.st.getTracks().forEach(t=>t.stop());$('ra').srcObject=null;$('call').classList.add('hide');
}
async function onSig(p){
 if(!p||p.to!=me.id)return;
 if(p.t=='offer'){
  if(C)return sg(p.from,'busy');
  const u=chats[p.from]||(await sb.from('profiles').select('*').eq('id',p.from).single()).data;if(!u||C)return;
  const c=C={u,q:[],role:'in',offer:p.d.sdp};ringStart();callUi();
  c.to=setTimeout(()=>{if(C===c&&!c.acc)callEnd(false)},45000);return;
 }
 if(!C||C.u.id!=p.from)return;
 if(p.t=='answer'&&C.role=='out'){await C.pc.setRemoteDescription(p.d.sdp);await flushQ(C);connTo(C)}
 else if(p.t=='ice'){if(C.pc&&C.pc.remoteDescription)try{await C.pc.addIceCandidate(p.d)}catch(e){}else C.q.push(p.d)}
 else if(p.t=='end'||p.t=='busy'){const b=p.t=='busy';callEnd(false);if(b)alert('Занято')}
}
function callUi(){
 const c=C;if(!c)return $('call').classList.add('hide');
 if(c.acc||c.live)stopRing();$('call').classList.remove('hide');$('cav').innerHTML=ava(c.u);$('cn').textContent=c.u.nick;
 $('cs').textContent=c.live?fmt(Date.now()-c.t0):c.role=='in'&&!c.acc?'Входящий звонок…':c.role=='out'&&!c.pc.remoteDescription?'Вызов…':'Соединение…';
 const b=$('cb');b.innerHTML='';
 const add=(ic,fn,cl)=>{const x=document.createElement('button');x.className=cl;x.textContent=ic;x.onclick=fn;b.append(x)};
 if(c.role=='in'&&!c.acc){add('📞',callAcc,'cg');add('📞',()=>callEnd(true),'cr')}
 else{
  add(c.mute?'🔇':'🎤',()=>{c.mute=!c.mute;c.st.getAudioTracks().forEach(t=>t.enabled=!c.mute);callUi()},c.mute?'on':'i');
  add(c.deaf?'🔕':'🎧',()=>{c.deaf=!c.deaf;$('ra').muted=c.deaf;callUi()},c.deaf?'on':'i');
  add('📞',()=>callEnd(true),'cr');
 }
}
let ringIv=0,ringAC=null;
function ringStart(){stopRing();const A=ringAC=new AudioContext();A.resume();
 const beep=()=>{if(A.state!='running')return;const o=A.createOscillator(),g=A.createGain();o.frequency.value=440;g.gain.value=.15;o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+.4);navigator.vibrate&&navigator.vibrate([400,200,400])};
 beep();ringIv=setInterval(beep,1500)}
function stopRing(){clearInterval(ringIv);ringIv=0;if(ringAC){ringAC.close().catch(()=>{});ringAC=null}navigator.vibrate&&navigator.vibrate(0)}
const PH=c=>`<svg width="18" height="18" viewBox="0 0 24 24" fill="${c}"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.6 3.6a1 1 0 0 1-.25 1z"/></svg>`;
function callTxt(m,k){const n=esc(m.sender==me.id?me.nick:cur.nick);return PH(k.ok?'#4ade80':'#9ca3af')+' <b>'+n+'</b> звонил'+(k.ok?'<br>Звонок продлился '+fmt(k.d):'')}
async function logCall(c){const j='\u0001'+JSON.stringify({k:{ok:c.live?1:0,d:c.live?Date.now()-c.t0:0}});await push(await pack(j),j,c.u)}
const connTo=c=>{c.ct=setTimeout(()=>{if(C===c&&!c.live){callEnd(true);alert('Связь не установилась. Для мобильного интернета нужен TURN-сервер')}},20000)};
$('cl').onclick=()=>{if(cur)callStart(cur)};
addEventListener('beforeunload',()=>{if(C)callEnd(true)});
function presence(){ // «в сети»: пока приложение открыто
 const pc=sb.channel('online',{config:{presence:{key:me.id}}});
 pc.on('presence',{event:'sync'},()=>{on.clear();Object.keys(pc.presenceState()).forEach(k=>on.add(k));list();
  if(cur)$('pill').innerHTML=ava(cur)+`<b>${esc(cur.nick)}</b>`}).subscribe(async st=>{if(st=='SUBSCRIBED')await pc.track({t:Date.now()})});
}
start();
</script></body></html>
