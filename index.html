// ---------- сжатие видео на устройстве: уменьшение размера кадра + битрейт, VP9/Opus (идёт в реальном времени) ----------
const LIMV=8*1048576; // лимит видео 8 МБ
// Способ 1 — логика Rotato (FFmpeg: H.264, постоянное качество, разрешение не меняется); дальше — прежнее сжатие и максимальное
const PR=[{n:'Качество как у Rotato',w:1920,bpp:.025,min:3e5,max:3.5e6,ab:64000,fps:30},{n:'Сильнее',w:720,vb:9e5,ab:48000,fps:30},{n:'Максимум',w:360,vb:18e4,ab:20000,fps:15}];
const VM=['video/mp4;codecs=avc1.640028,mp4a.40.2','video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus'];
const ev2=x=>Math.max(2,Math.round(x/2)*2);
function vdim(P,m){const k=Math.min(1,P.w/Math.max(m.w,m.h)),w=ev2(m.w*k),h=ev2(m.h*k);return{w,h,vb:P.vb||Math.round(Math.min(P.max,Math.max(P.min,w*h*P.fps*P.bpp)))}}
const vpred=(P,m)=>(vdim(P,m).vb+P.ab)*m.d/8*1.15; // ожидаемый вес файла
function vmeta(f){return new Promise((ok,no)=>{const v=document.createElement('video'),bad=()=>no(new Error('Не удалось прочитать видео'));v.preload='metadata';v.src=URL.createObjectURL(f);
 v.onloadedmetadata=()=>{const m={w:v.videoWidth,h:v.videoHeight,d:v.duration};URL.revokeObjectURL(v.src);isFinite(m.d)&&m.w?ok(m):bad()};v.onerror=bad})}
function cvid(f,P,m,onp){return new Promise((ok,no)=>{
 const v=document.createElement('video');v.src=URL.createObjectURL(f);v.playsInline=true;v.onerror=()=>no(new Error('Не удалось прочитать видео'));
 v.onloadedmetadata=async()=>{try{
  const {w,h,vb}=vdim(P,m),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  const AC=new AudioContext(),dst=AC.createMediaStreamDestination();AC.createMediaElementSource(v).connect(dst);
  const st=c.captureStream(P.fps);dst.stream.getAudioTracks().forEach(t=>st.addTrack(t));
  let r,mt;for(const t of VM){if(!MediaRecorder.isTypeSupported(t))continue;try{r=new MediaRecorder(st,{mimeType:t,videoBitsPerSecond:vb,audioBitsPerSecond:P.ab});mt=t;break}catch(e){}}
  if(!r)throw new Error('Браузер не умеет записывать видео');
  const ch=[];let run=true;
  r.ondataavailable=e=>ch.push(e.data);
  r.onstop=()=>{AC.close();URL.revokeObjectURL(v.src);ok(new Blob(ch,{type:mt.split(';')[0]}))};
  const dr=()=>{if(!run)return;x.drawImage(v,0,0,w,h);onp&&onp(v.currentTime/v.duration);requestAnimationFrame(dr)};
  v.onended=()=>{run=false;r.stop()};
  r.start(1000);await AC.resume();await v.play();dr();
 }catch(e){no(e)}}})}
async function addVideo(f){
 const it={kind:'v',pr:0,st:''},rm=()=>{const k=pend.indexOf(it);if(k>=0)pend.splice(k,1);showPv()};pend.push(it);showPv();
 try{
  const m=await vmeta(f);let b=null;
  for(let i=0;i<PR.length;i++){
   if(vpred(PR[i],m)>LIMV)continue; // по расчёту не влезает — сразу следующий способ
   it.st=PR[i].n+' ('+(i+1)+'/3)';it.pr=0;showPv();let last=-1;
   const r=await cvid(f,PR[i],m,p=>{const q=Math.round(p*100);if(q!=last){last=q;it.pr=p;showPv()}});
   if(it.stop)return;if(r.size<=LIMV){b=r;break}
  }
  if(!b)throw new Error('Видео не влезает в лимит 8 МБ даже при максимальном сжатии. Отправка отменена.');
  it.blob=b;it.url=URL.createObjectURL(b);it.st='';showPv();
 }catch(e){rm();alert(e.message)}
}

  const tb=(t,qq)=>new Promise(r=>c.toBlob(r,t,qq));let b=null;if(av){b=await tb('image/avif',q);if(!b||b.type!='image/avif')b=null}return b||await tb('image/webp',q)};
 for(const [max,q,av] of [[4096,.85,0],[1280,.55,1],[960,.35,0]]){const b=await enc(max,q,av);if(b&&b.size<=LIMP)return b}

async function addFile(f){ // сжатие файла на устройстве (gzip — самое сильное, что есть в браузере), лимит 10 МБ после сжатия

 try{let b=await new Response(f.stream().pipeThrough(new CompressionStream('gzip'))).blob(),z=1;if(b.size>=f.size){b=f;z=0}
  if(b.size>10e6)throw new Error('Файл «'+f.name+'» после сжатия весит '+sz(b.size)+' — больше лимита 10 МБ. Отправка отменена.');
  it.blob=b;it.z=z;it.url='f'}catch(e){const k=pend.indexOf(it);if(k>=0)pend.splice(k,1);showPv();return alert(e.message)}

const mic=()=>navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
const prof=async id=>chats[id]||(await sb.from('profiles').select('*').eq('id',id).single()).data;
const peer=(c,u)=>c.P[u.id]=c.P[u.id]||{u,q:[]};
async function flushQ(x){for(const i of x.q)try{await x.pc.addIceCandidate(i)}catch(e){}x.q=[]}
function connTo(c,x){clearTimeout(x.ct);x.ct=setTimeout(()=>{if(C===c&&!x.live){const last=Object.keys(c.P).length==1;dropPeer(c,x,true);if(last)alert('Связь не установилась. Для мобильного интернета нужен TURN-сервер')}},20000)}
function mkPc(c,x){
 const pc=x.pc=new RTCPeerConnection(ICE);
 c.st.getTracks().forEach(t=>pc.addTrack(t,c.st));if(c.vtr)x.vsend=pc.addTrack(c.vtr,c.st);
 x.au=new Audio();x.au.autoplay=true;x.au.muted=!!c.deaf;x.vid=document.createElement('video');x.vid.muted=true;x.vid.playsInline=true;x.vid.autoplay=true;x.vid.className='hide';$('rvs').append(x.vid);
 pc.onicecandidate=e=>e.candidate&&sg(x.u,'ice',e.candidate.toJSON(),c.cid);
 pc.ontrack=e=>{const m=e.streams[0];x.au.srcObject=m;x.vid.srcObject=m;x.au.play().catch(()=>{});e.track.onmute=e.track.onunmute=updRv;updRv()};
 pc.onnegotiationneeded=async()=>{if(!x.live||pc.signalingState!='stable')return;try{const o=await pc.createOffer();await pc.setLocalDescription(o);sg(x.u,'offer',{sdp:o},c.cid)}catch(e){}};
 pc.oniceconnectionstatechange=()=>{const s=pc.iceConnectionState;
  if(s=='connected'||s=='completed'){if(!x.live){x.live=1;clearTimeout(x.ct);if(!c.t0){c.t0=Date.now();stopRing()}}if(C===c)callUi()}
  else if(s=='disconnected'){clearTimeout(x.rt);x.rt=setTimeout(()=>{if(C===c&&pc.iceConnectionState=='disconnected'&&pc.restartIce)pc.restartIce()},4000)}
  else if(s=='failed'&&C===c){const last=Object.keys(c.P).length==1;dropPeer(c,x,true);if(last)alert('Не удалось соединиться. Для мобильного интернета нужен TURN-сервер')}};
}
function dropPeer(c,x,notify){clearTimeout(x.ct);if(notify)sg(x.u,'end',null,c.cid);x.pc&&x.pc.close();if(x.au)x.au.srcObject=null;x.vid&&x.vid.remove();delete c.P[x.u.id];
 if(C!==c)return;if(!Object.keys(c.P).length)callEnd(false);else{updRv();callUi()}}
async function callStart(tg,ids){
 if(C)return;ids=ids.slice(0,3);let st;try{st=await mic()}catch(e){return alert('Нет доступа к микрофону')}
 const c=C={cid:crypto.randomUUID(),st,P:{},role:'out',acc:1,tg,roster:[me.id,...ids]};ringStart(.3);wlOn();callUi();
 for(const id of ids){const u=tg.isG?tg.mem.find(z=>z.id==id):tg,x=peer(c,u);mkPc(c,x);
  const o=await x.pc.createOffer();await x.pc.setLocalDescription(o);sg(u,'offer',{sdp:o,roster:c.roster,gn:tg.isG?tg.nick:null},c.cid);
  x.ct=setTimeout(()=>{if(C===c&&!x.live)dropPeer(c,x,true)},30000)} // 30 секунд на ответ
 callUi();
}
async function callAcc(){
 const c=C;if(!c||c.acc)return;stopRing();clearTimeout(c.to);let st;try{st=await mic()}catch(e){callEnd(true);return alert('Нет доступа к микрофону')}
 c.st=st;c.acc=1;wlOn();const x=Object.values(c.P)[0];mkPc(c,x);await x.pc.setRemoteDescription(c.offer);await flushQ(x);
 const a=await x.pc.createAnswer();await x.pc.setLocalDescription(a);sg(x.u,'answer',{sdp:a},c.cid);connTo(c,x);
 c.roster.filter(id=>id!=me.id&&id!=x.u.id).forEach(id=>sg(id,'hello',null,c.cid)); // остальным участникам: «я в звонке, соединитесь со мной»
 callUi();
}
function callEnd(notify){
 const c=C;if(!c)return;C=null;clearTimeout(c.to);stopRing();wlOff();
 Object.values(c.P).forEach(x=>{clearTimeout(x.ct);if(notify)sg(x.u,'end',null,c.cid);x.pc&&x.pc.close();if(x.au)x.au.srcObject=null;x.vid&&x.vid.remove()});
 if(c.role=='out')logCall(c);
 c.st&&c.st.getTracks().forEach(t=>t.stop());c.vtr&&c.vtr.stop();
 ['lv','cf'].forEach(i=>$(i).classList.add('hide'));$('rvs').classList.add('hide');$('call').classList.remove('vo');$('call').classList.remove('mini');$('call').classList.add('hide');
}
async function answerNew(c,u,p){const y=peer(c,u);mkPc(c,y);await y.pc.setRemoteDescription(p.d.sdp);await flushQ(y);
 const a=await y.pc.createAnswer();await y.pc.setLocalDescription(a);sg(u,'answer',{sdp:a},c.cid);connTo(c,y);callUi()}
async function onSig(p){
 if(!p||p.to!=me.id)return;if(prefs[p.from]&&prefs[p.from].blocked)return;
 const c=C;
 if(p.t=='offer'){
  if(c&&c.cid==p.cid){const x=c.P[p.from];
   if(x&&x.pc&&(x.live||(x.pc.signalingState=='have-local-offer'&&me.id>p.from)))return reneg(c,x,p);
   if(c.acc&&!x){const u=await prof(p.from);if(u&&C===c&&!c.P[p.from])await answerNew(c,u,p)}
   return}
  if(c)return sg(p.from,'busy',null,p.cid);
  const u=await prof(p.from);if(!u||C)return;
  const n=C={cid:p.cid,P:{},role:'in',roster:p.d.roster||[],offer:p.d.sdp,gn:p.d.gn};peer(n,u);ringStart(1);callUi();if(document.hidden)notify('Входящий звонок',(p.d.gn?p.d.gn+' · ':'')+u.nick,'call');
  n.to=setTimeout(()=>{if(C===n&&!n.acc)callEnd(true)},30000);return;
 }
 if(!c||c.cid!=p.cid)return;const x=c.P[p.from];
 if(p.t=='hello'){if(c.acc&&!x){const u=await prof(p.from);if(!u||C!==c||c.P[p.from])return;const y=peer(c,u);mkPc(c,y);
   const o=await y.pc.createOffer();await y.pc.setLocalDescription(o);sg(u,'offer',{sdp:o,roster:c.roster},c.cid);connTo(c,y)}return}
 if(!x)return;
 if(p.t=='answer'){if(!x.pc||x.pc.signalingState!='have-local-offer')return;await x.pc.setRemoteDescription(p.d.sdp);await flushQ(x);if(!x.live)connTo(c,x)}
 else if(p.t=='ice'){if(x.pc&&x.pc.remoteDescription)try{await x.pc.addIceCandidate(p.d)}catch(e){}else x.q.push(p.d)}
 else if(p.t=='end'||p.t=='busy'){if(p.t=='busy'&&Object.keys(c.P).length==1)alert('Занято');dropPeer(c,x,false)}
}
async function reneg(c,x,p){if(x.pc.signalingState=='have-local-offer'&&me.id<p.from)return;
 await x.pc.setRemoteDescription(p.d.sdp);await flushQ(x);const a=await x.pc.createAnswer();await x.pc.setLocalDescription(a);sg(x.u,'answer',{sdp:a},c.cid)}
function callUi(){
 const c=C;if(!c)return $('call').classList.add('hide');
 const xs=Object.values(c.P);if(c.role=='in'&&c.acc)stopRing();if(!xs.length)return;
 if(c.role=='in'&&!c.acc)$('call').classList.remove('mini');$('call').classList.remove('hide');$('cav').innerHTML=ava(c.tg||xs[0].u);$('cn').textContent=c.tg&&c.tg.isG?c.tg.nick:c.gn||xs[0].u.nick;$('cs').textContent=csTxt();updRv();
 const b=$('cb');b.innerHTML='';
 const add=(ic,fn,cl)=>{const y=document.createElement('button');y.className=cl;y.textContent=ic;y.onclick=fn;b.append(y)};
 if(c.role=='in'&&!c.acc){add('📞',callAcc,'cg');add('📞',()=>callEnd(true),'cr')}
 else{
  add(c.mute||c.deaf?'🔇':'🎤',()=>{if(c.deaf){c.deaf=false;c.mute=false}else c.mute=!c.mute;applyAud(c);callUi()},c.mute||c.deaf?'on':'i');
  add(c.deaf?'🔕':'🎧',()=>{c.deaf=!c.deaf;applyAud(c);callUi()},c.deaf?'on':'i');
  if(xs.some(x=>x.live)){
   const cam=c.vk&&c.vk!='screen';
   add('📹',()=>cam?setVideo(null):camPick(c),cam?'on':'i'); // выключается сразу, при включении спрашивает камеру
   if(navigator.mediaDevices.getDisplayMedia)add('🖥',()=>setVideo(c.vk=='screen'?null:'screen'),c.vk=='screen'?'on':'i');
  }
  add('📞',()=>callEnd(true),'cr');
 }
 $('cf').classList.toggle('hide',!(c.vk&&c.vk!='screen'));
}
function applyAud(c){c.st.getAudioTracks().forEach(t=>t.enabled=!c.mute&&!c.deaf);Object.values(c.P).forEach(x=>{if(x.au)x.au.muted=!!c.deaf})} // наушники выкл => микрофон выкл; при включении микрофон возвращается в прежнее состояние
function camPick(c){const m=mod('<h3>Какая камера?</h3><button id="k1" class="i">🤳 Фронтальная</button><button id="k2" class="i">📷 Основная</button>');
 const go=k=>{m.classList.add('hide');setVideo(k)};$('k1').onclick=()=>go('user');$('k2').onclick=()=>go('environment')}

function updRv(){const c=C;let any=0;if(c)Object.values(c.P).forEach(x=>{const m=x.vid&&x.vid.srcObject,on=!!m&&m.getVideoTracks().some(t=>t.readyState=='live'&&!t.muted);if(x.vid)x.vid.classList.toggle('hide',!on);any|=on});
 $('rvs').classList.toggle('hide',!any);$('call').classList.toggle('vo',!!any)}
function locV(){const c=C,v=$('lv');if(c&&c.vtr){v.srcObject=new MediaStream([c.vtr]);v.style.transform=c.vk=='user'?'scaleX(-1)':'';v.classList.remove('hide')}else{v.srcObject=null;v.classList.add('hide')}}
async function setVideo(kind){ // 'user' | 'environment' | 'screen' | null — трек уходит всем участникам звонка
 const c=C;if(!c)return;if(c.vtr){c.vtr.stop();c.vtr=null}
 const xs=Object.values(c.P).filter(x=>x.pc);
 if(!kind){xs.forEach(x=>{if(x.vsend){try{x.pc.removeTrack(x.vsend)}catch(e){}x.vsend=null}});c.vk=null;callUi();locV();return}
 let st;
 try{st=kind=='screen'?await navigator.mediaDevices.getDisplayMedia({video:{frameRate:{ideal:60,max:60},width:{ideal:1920},height:{ideal:1080}},audio:false}):await navigator.mediaDevices.getUserMedia({video:{facingMode:kind,width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}}})}
 catch(e){c.vk=null;callUi();locV();return alert(kind=='screen'?'Не удалось начать показ экрана':'Нет доступа к камере')}
 const t=c.vtr=st.getVideoTracks()[0];if(kind!='screen')c.fp=kind;else t.contentHint='motion';
 t.onended=()=>{if(C===c&&c.vtr===t)setVideo(null)};
 for(const x of xs){if(x.vsend)await x.vsend.replaceTrack(t);else x.vsend=x.pc.addTrack(t,c.st);
  try{const sp=x.vsend.getParameters();sp.encodings=sp.encodings&&sp.encodings.length?sp.encodings:[{}];const e0=sp.encodings[0],sc=kind=='screen';e0.maxBitrate=sc?8e6:2.5e6;e0.maxFramerate=sc?60:30;sp.degradationPreference=sc?'maintain-framerate':'balanced';await x.vsend.setParameters(sp)}catch(e){}}
 c.vk=kind;callUi();locV();
}
function ringStart(v){stopRing();const r=$('ring');r.volume=v;r.currentTime=0;r.play().catch(()=>{});if(v==1)ringIv=setInterval(()=>navigator.vibrate&&navigator.vibrate([400,200,400]),1500)}
function stopRing(){clearInterval(ringIv);ringIv=0;const r=$('ring');r.pause();navigator.vibrate&&navigator.vibrate(0)}

function callTxt(m,k){const n=esc(m.sender==me.id?me.nick:cur.isG?nm(m.sender):cur.nick);return PH(k.ok?'#4ade80':'#9ca3af')+' <b>'+n+'</b> звонил'+(k.ok?'<br>Звонок продлился '+fmt(k.d):'')}
async function logCall(c){const j='\u0001'+JSON.stringify({k:{ok:c.t0?1:0,d:c.t0?Date.now()-c.t0:0}});await push(await pack(j),j,c.tg)}
$('cl').onclick=()=>{if(!cur||C)return;const u=cur;
 if(!u.isG){if(!on.has(u.id))return alert(u.nick+' сейчас не в сети');return callStart(u,[u.id])}
 const ms=u.mem.filter(z=>z.id!=me.id),

 $('gc').onclick=()=>{const ids=[...m.querySelectorAll('input:checked')].map(i=>i.value);if(!ids.length)return;m.classList.add('hide');callStart(u,ids)}};
addEventListener('beforeunload',()=>{if(C)callEnd(true)});

 const pc=sb.channel('online',{config:{presence:{key:me.id}}});
 pc.on('presence',{event:'sync'},()=>{on.clear();Object.keys(pc.presenceState()).forEach(k=>on.add(k));list();
  if(cur)pillUpd()}).subscribe(async st=>{if(st=='SUBSCRIBED')await pc.track({t:Date.now()})});
